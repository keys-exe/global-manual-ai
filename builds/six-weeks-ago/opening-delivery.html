"note": "generic blank packaging"}, {"id": "PB-SC05-SH02", "p": "P-020", "kind": "SH", "scale": "MCU", "rig": "F2", "fn": "—", "subj": "Barbara, mug in hand — 'You've done this every morning since I got here...'", "emo": "gentle probe", "vis": "—", "note": ""}, {"id": "PB-SC05-SH03", "p": "P-021", "kind": "SH", "scale": "CU", "rig": "F2", "fn": "CONSEQUENCE", "subj": "Margaret — 'For eleven years.'", "emo": "resigned", "vis": "—", "note": ""}, {"id": "TN-SC05-SH04", "p": "P-022", "kind": "SH", "scale": "MCU", "rig": "F1", "fn": "—", "subj": "Barbara — 'Can I show you something?'", "emo": "decision", "vis": "—", "note": ""}, {"id": "TN-SC05-SH05", "p": "A", "kind": "INS", "scale": "ECU", "rig": "F4", "fn": "PRODUCT-IN-LIFE", "subj": "REVEAL: Barbara pulls up her wide trouser leg; the strap sits under her left kneecap", "emo": "reveal", "vis": "REVEAL", "note": "hero insert §24G; nano_banana_pro; PLACE-LOCK; D3 'small' not rendered small"}, {"id": "TN-SC05-SH06", "p": "P-023", "kind": "SH", "scale": "MCU", "rig": "F2", "fn": "—", "subj": "Barbara — 'It's called Stryde. I had it on at the wedding. All night.'", "emo": "proud", "vis": "—", "note": ""}, {"id": "TN-SC05-SH07", "p": "P-024", "kind": "SH", "scale": "CU", "rig": "F2", "fn": "—", "subj": "Margaret — 'That little thing? ...can't possibly work on knees like mine.'", "emo": "scepticism", "vis": "—", "note": ""}, {"id": "TN-SC05-SH08", "p": "P-025", "kind": "SH", "scale": "MCU", "rig": "F1", "fn": "—", "subj": "Barbara — 'That's exactly what I said. Last winter I was sleeping on my sofa...'", "emo": "candour", "vis": "—", "note": ""}, {"id": "TN-SC05-SH09", "p": "P-026", "kind": "SH", "scale": "MCU", "rig": "F2", "fn": "—", "subj": "Barbara — 'Every brace you've ever bought was made to keep you comfortable while your knee got worse...'", "emo": "conviction", "vis": "—", "note": ""}, {"id": "TN-SC05-SH10", "p": "P-026", "kind": "INS", "scale": "INSERT", "rig": "F4", "fn": "EVIDENCE", "subj": "On 'a sleeve just squeezes / a brace just stops it going sideways': Barbara's hand turns the old hinged brace on the table", "emo": "demonstration", "vis": "—", "note": "no competitor wordmark"}, {"id": "TN-SC05-SH11", "p": "P-027", "kind": "SH", "scale": "CU", "rig": "F2", "fn": "—", "subj": "Margaret — 'No.'", "emo": "listening", "vis": "—", "note": ""}, {"id": "TN-SC05-SH12", "p": "P-028", "kind": "SH", "scale": "MCU", "rig": "F2", "fn": "—", "subj": "Barbara — 'It hurts coming down the stairs. Put your finger just under your kneecap...'", "emo": "guiding", "vis": "—", "note": ""}, {"id": "TN-SC05-SH13", "p": "P-028,P-029", "kind": "INS", "scale": "ECU", "rig": "F2", "fn": "EVIDENCE", "subj": "Margaret's own finger pressing into the tendon just under her right kneecap — 'Yes.'", "emo": "recognition", "vis": "—", "note": "demonstration gate: verifiable in 3s"}, {"id": "TN-SC05-SH14", "p": "P-030", "kind": "SH", "scale": "MCU", "rig": "F1", "fn": "—", "subj": "Barbara — 'That's the tendon. Every step you take lands right there...'", "emo": "weight", "vis": "—", "note": ""}, {"id": "TN-SC05-SH15", "p": "P-030", "kind": "MECH", "scale": "SCREEN", "rig": "F1", "fn": "MECHANISM", "subj": "Barbara turns her phone: the knee render; push in and cut on the push to the §12A render — load arriving at the tendon at footstep rate", "emo": "understanding", "vis": "—", "note": "SCREEN route (§24G); 17× is Tier 3 — no numerals on screen"}, {"id": "TN-SC05-SH16", "p": "P-031", "kind": "SH", "scale": "CU", "rig": "F2", "fn": "—", "subj": "Margaret — 'Barbara, my knees are bone on bone. There's nothing left in there.'", "emo": "despair", "vis": "—", "note": ""}, {"id": "TN-SC05-SH17", "p": "P-032", "kind": "SH", "scale": "CU", "rig": "F1", "fn": "—", "subj": "Barbara — 'Mine too. This doesn't put anything back... I haven't got time to lie to you.'", "emo": "hard honesty", "vis": "—", "note": "trust line; hold on the eyes"}, {"id": "TN-SC05-SH18", "p": "P-033", "kind": "SH", "scale": "CU", "rig": "F2", " ns, dark indigo", "trainers, grey walking", "scarf, paisley · two shopping bags", "navy/denim", "AF-SC08 · hall · CONCEALED"], ["D5", "Frank", "polo shirt, bottle green", "buttoned cable cardigan, oatmeal (signature)", "wax jacket, olive — half on", "cords, brown", "loafers, brown suede (sheet)", "—", "green family", "AF-SC08 · hall"], ["D6", "Margaret", "blouse, soft-pink floral", "buttoned cardigan, cream", "—", "wide-leg trousers, navy", "slippers, moccasin", "signature glasses", "pattern-led", "AF-SC09 stairs · REVEAL ; AF-SC10 kitchen · CONCEALED"], ["D6", "Sarah", "button-down shirt, chambray", "—", "—", "cords, tan", "loafers, brown", "signature hoops", "earth", "AF-SC09 stairs ; AF-SC10 doorway"], ["D6", "Emily", "cable crew jumper worn alone, soft sage", "—", "—", "jeans, light wash", "ankle boots, tan suede", "—", "green family", "AF-SC10 · kitchen"], ["D7", "Margaret", "tunic, mustard", "—", "—", "leggings, charcoal", "slipper boots, grey knit", "signature glasses", "earth", "OC-SC11 · living room · CONCEALED ; two straps HELD"]], "inv": [{"p": "P-001", "sc": "SC02", "who": "SARAH", "dir": "", "line": "It's just a stairlift, Mom. Just look at it."}, {"p": "P-002", "sc": "SC02", "who": "MARGARET", "dir": "", "line": "I know what it is."}, {"p": "P-003", "sc": "SC02", "who": "SARAH", "dir": "", "line": "I watched you come down those stairs backwards."}, {"p": "P-004", "sc": "SC02", "who": "MARGARET", "dir": "", "line": "Then don't watch."}, {"p": "P-005", "sc": "SC02", "who": "SARAH", "dir": "her voice cracking", "line": "Somebody has to. You're 71. Some days you don't even come downstairs. Dad's bringing your tea up on a tray."}, {"p": "P-006", "sc": "SC02", "who": "MARGARET", "dir": "", "line": "I've done the physio, Sarah. The painkillers. The injections. I've got a drawer full of braces upstairs, and the last one slid down around my ankle by the evening."}, {"p": "P-007", "sc": "SC02", "who": "SARAH", "dir": "", "line": "So let them put the stairlift in."}, {"p": "P-008", "sc": "SC02", "who": "MARGARET", "dir": "", "line": "A stairlift is how it starts."}, {"p": "P-009", "sc": "SC02", "who": "SARAH", "dir": "", "line": "How what starts?"}, {"p": "P-010", "sc": "SC03", "who": "FRANK", "dir": "in the dark", "line": "Do you ever think about which one of us goes first?"}, {"p": "P-011", "sc": "SC03", "who": "MARGARET", "dir": "", "line": "Frank."}, {"p": "P-012", "sc": "SC03", "who": "FRANK", "dir": "", "line": "If it's me... who gets you down the stairs?"}, {"p": "P-013", "sc": "SC03", "who": "MARGARET", "dir": "", "line": "Go to sleep, love."}, {"p": "P-014", "sc": "SC04", "who": "EMILY", "dir": "in her wedding dress, holding out her hands", "line": "Grandma, you promised. When I was little, you said you'd dance at my wedding."}, {"p": "P-015", "sc": "SC04", "who": "MARGARET", "dir": "smiling, eyes wet", "line": "I know I did, sweetheart. I'll watch from here."}, {"p": "P-016", "sc": "SC04", "who": "FRANK", "dir": "", "line": "Is that Barbara out there? Your cousin Barbara?"}, {"p": "P-017", "sc": "SC04", "who": "MARGARET", "dir": "", "line": "She's 74."}, {"p": "P-018", "sc": "SC04", "who": "FRANK", "dir": "", "line": "I thought her knees were bone on bone."}, {"p": "P-019", "sc": "SC04", "who": "MARGARET", "dir": "watching her", "line": "They are. I always thought hers weren't as bad as mine."}, {"p": "P-020", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "You've done this every morning since I got here. Two pills, the gel, the brace and an ice pack."}, {"p": "P-021", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "For eleven years."}, {"p": "P-022", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "Can I show you something?"}, {"p": "P-023", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "It's called Stryde. I had it on at the wedding. All night."}, {"p": "P-024", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "That little thing? Barbara, that can't possibly work on knees like mine."}, {"p": "P-025", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "That's exactly what I said. Last winter I was sleeping on my sofa because I couldn't get up my own stairs."}, {"p": "P-026", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "Every brace you've ever bought was made to keep you comfortable while your knee got worse. A sleeve just squeezes the knee. A brace just stops it going sideways. Does your knee hurt going sideways?"}, {"p": "P-027", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "No."}, {"p": "P-028", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "It hurts coming down the stairs. Put your finger just under your kneecap. Two centimetres down. Press in. Feel that band?"}, {"p": "P-029", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "Yes."}, {"p": "P-030", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "That's the tendon. Every step you take lands right there. Seventeen times your bodyweight goes through it. Every stride."}, {"p": "P-031", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "Barbara, my knees are bone on bone. There's nothing left in there."}, {"p": "P-032", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "Mine too. This doesn't put anything back. Nothing can, and anyone who tells you otherwise is lying to you. I'm 74, Margaret. I haven't got time to lie to you."}, {"p": "P-033", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "Then what does it do?"}, {"p": "P-034", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "It changes where the weight lands. It sits just under the kneecap, right on that band. There's a silicone pad on the inside. The pad presses on that one spot, instead of spreading the pressure around the whole knee like a sleeve does. It catches the weight and moves it off the worn part, before it gets to the joint."}, {"p": "P-035", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "They measured it. Thirty four percent less strain, every step."}, {"p": "P-036", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "Bone on bone, arthritis, worn cartilage, meniscus. Whichever one your doctor said it was, that's the spot taking the weight. Every brace and every injection you've had was aimed at the whole knee. Not that spot. That's why nothing worked."}, {"p": "P-037", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "Your arthritis will still be there. The weight just won't be landing where it hurts."}, {"p": "P-038", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "It'll slip. They all slip."}, {"p": "P-039", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "It's adjustable, and it doesn't go over the joint, so there's nothing to bunch up or roll down. Ten seconds to put on. It sits flat under your trousers, and you forget it's there. They spent three years building it with orthopaedic surgeons. Over two hundred thousand people wear one."}, {"p": "P-040", "sc": "SC05", "who": "MARGARET", "dir": "quietly", "line": "I can't try another thing that doesn't work, Barbara. I can't get my hopes up again."}, {"p": "P-041", "sc": "SC05", "who": "BARBARA", "dir": "putting a strap in her hand", "line": "Then don't get your hopes up. Just put it on and walk down the stairs. And keep your hand on the rail. I'm not crazy."}, {"p": "P-042", "sc": "SC06", "who": "MARGARET", "dir": "", "line": "I can't, Barbara. I haven't come down these forwards in two years."}, {"p": "P-043", "sc": "SC06", "who": "BARBARA", "dir": "", "line": "Hand on the rail. One step. That's all I'm asking."}, {"p": "P-044", "sc": "SC06", "who": "BARBARA", "dir": "", "line": "Feel that under the kneecap? That's the weight going somewhere else."}, {"p": "P-045", "sc": "SC06", "who": "MARGARET", "dir": "tears running", "line": "Barbara... I'm not gripping it."}, {"p": "P-046", "sc": "SC06", "who": "BARBARA", "dir": "her own eyes wet", "line": "I know, love. Keep coming."}, {"p": "P-047", "sc": "SC06", "who": "MARGARET", "dir": "", "line": "I can't believe it. I can't believe it."}, {"p": "P-048", "sc": "SC06", "who": "BARBARA", "dir": "", "line": "Well, don't just stand there. Put the kettle on."}, {"p": "P-049", "sc": "SC07", "who": "DOCTOR", "dir": "looking at an X-ray", "line": "Your new X-ray looks exactly like the old one, Margaret. Bone on bone, both knees."}, {"p": "P-050", "sc": "SC07", "who": "MARGARET", "dir": "", "line": "I know."}, {"p": "P-051", "sc": "SC07", "who": "DOCTOR", "dir": "", "line": "So how did you just walk in here like that?"}, {"p": "P-052", "sc": "SC07", "who": "DOCTOR", "dir": "leaning in, then nodding", "line": "That makes sense. It's moving the weight off the worn part. Keep wearing it."}, {"p": "P-053", "sc": "SC07", "who": "MARGARET", "dir": "smiling", "line": "I wasn't planning on taking it off."}, {"p": "P-054", "sc": "SC08", "who": "FRANK", "dir": "", "line": "I was just coming to look for you. You were gone a long time."}, {"p": "P-055", "sc": "SC08", "who": "MARGARET", "dir": "", "line": "I know."}, {"p": "P-056", "sc": "SC08", "who": "FRANK", "dir": "", "line": "Where did you go?"}, {"p": "P-057", "sc": "SC08", "who": "MARGARET", "dir": "", "line": "Into town."}, {"p": "P-058", "sc": "SC08", "who": "FRANK", "dir": "", "line": "You walked into town? That's two miles."}, {"p": "P-059", "sc": "SC08", "who": "MARGARET", "dir": "putting the bags down", "line": "Each way."}, {"p": "P-060", "sc": "SC08", "who": "FRANK", "dir": "", "line": "I called the stairlift man."}, {"p": "P-061", "sc": "SC08", "who": "MARGARET", "dir": "", "line": "Frank..."}, {"p": "P-062", "sc": "SC08", "who": "FRANK", "dir": "", "line": "I told him not to come. (his voice goes) All those nights I lay there thinking, if it's me that goes first..."}, {"p": "P-063", "sc": "SC08", "who": "MARGARET", "dir": "taking his hand", "line": "Then I'll manage the stairs."}, {"p": "P-064", "sc": "SC09", "who": "SARAH", "dir": "", "line": "Slowly, Mom. I'm right behind you."}, {"p": "P-065", "sc": "SC09", "who": "MARGARET", "dir": "", "line": "You can put your arms down now, love."}, {"p": "P-066", "sc": "SC09", "who": "SARAH", "dir": "tearing up", "line": "Mom... when did that happen?"}, {"p": "P-067", "sc": "SC09", "who": "MARGARET", "dir": "", "line": "Six weeks ago. Barbara happened."}, {"p": "P-068", "sc": "SC09", "who": "SARAH", "dir": "", "line": "What does that even mean?"}, {"p": "P-069", "sc": "SC09", "who": "MARGARET", "dir": "pulling up her trouser leg", "line": "It sits on the tendon under my kneecap and moves the weight off the worn part. My knees are still 71. It's not because the arthritis has gone. It's because the weight isn't landing where it hurts."}, {"p": "P-070", "sc": "SC10", "who": "EMILY", "dir": "", "line": "Grandma. You still owe me a dance."}, {"p": "P-071", "sc": "SC10", "who": "MARGARET", "dir": "", "line": "I always keep my promises."}, {"p": "P-072", "sc": "SC11", "who": "MARGARET", "dir": "on the phone", "line": "Joan, it's me. I've found something for your knees."}, {"p": "P-073", "sc": "SC11", "who": "JOAN", "dir": "", "line": "Oh, Margaret. Not another one."}, {"p": "P-074", "sc": "SC11", "who": "MARGARET", "dir": "", "line": "That's exactly what I said. It's called Stryde. Barbara gave me one. Get it from their website, the real one. There are copies out there. It's two for one right now, so you can do both knees. And if it doesn't work, you get your money back. Sixty days, and you keep the straps."}, {"p": "P-075", "sc": "SC11", "who": "JOAN", "dir": "", "line": "Well. What have I got to lose?"}, {"p": "P-076", "sc": "SC11", "who": "MARGARET", "dir": "", "line": "Nothing. Come over on Sunday. You're walking up my stairs on your own."}], "hooks": [{"name": "A · \"Get away\"", "vis": "Cool, grey grade. Extreme close-up: her knee trembles as she lowers herself backwards down the stairs, leading with the same foot, knuckles white on the banister. Sarah drops her shopping in the hall and runs up. Close-up: Margaret yanks her arm out of Sarah's hand. Sarah freezes. Close-up: Margaret turns her face to the wall with her chin shaking. She isn't angry, she's ashamed. Cut to a black screen with white text: 6 weeks ago", "lines": [{"who": "SARAH", "dir": "", "line": "Mom! Your knee! Here, let me help you."}, {"who": "MARGARET", "dir": "", "line": "No! I can do this. Get away from me!"}, {"who": "SARAH", "dir": "quietly", "line": "Mom, you're going down backwards."}, {"who": "MARGARET", "dir": "face to the wall", "line": "I know. Please don't watch me."}]}, {"name": "B · \"Seventy-one!\"", "vis": "Warm, bright grade. A busy station staircase at rush hour, with rails on both sides and one down the middle. Close-up: two women in their late 40s, each gripping a side rail, stiff-kneed, one step at a time. Margaret (71, work lanyard, handbag) comes down the middle almost running, her hand skimming the centre rail. Extreme close-up: her knees move easily, and a small black strap shows just under the kneecap below a cropped trouser hem. She slips between the two women, both heads turn, and she's gone. Cut to a black screen with white text: 6 weeks ago", "lines": [{"who": "WOMAN 1", "dir": "", "line": "My knees hate these stairs."}, {"who": "WOMAN 2", "dir": "", "line": "Tell me about it."}, {"who": "MARGARET", "dir": "from behind, hurrying", "line": "Excuse me! Sorry, love, I'm late for work!"}, {"who": "WOMAN 1", "dir": "staring after her", "line": "She's got to be seventy!"}, {"who": "MARGARET", "dir": "from the bottom, not looking back", "line": "Seventy-one!"}]}, {"name": "C · The floor", "vis": "Cool, grey grade. Close-up: a mug slides off the counter. Margaret bends for it. Extreme close-up: her right knee buckles sideways and she shouts as she drops. Frank (70s, cardigan) gets down slowly, puts his arm under hers and pulls. Close-up: his arms shake, and she doesn't move. Wide: they end up sitting on the floor together, backs against the cupboards. Cut to a black screen with white text: 6 weeks ago", "lines": [{"who": "MARGARET", "dir": "", "line": "Frank! Frank, it's my knee!"}, {"who": "FRANK", "dir": "", "line": "I've got you. Give me your arm."}, {"who": "MARGARET", "dir": "", "line": "Stop, Frank. You'll hurt your back."}, {"who": "FRANK", "dir": "still pulling, arms shaking", "line": "I'm not leaving you on the floor."}]}], "carry": {"H-A0": ["HKA-SC01-SH01", "HKA-SC01-SH02"], "H-A1": ["HKA-SC01-SH03"], "H-A2": ["HKA-SC01-SH04", "HKA-SC01-SH05"], "H-A3": ["HKA-SC01-SH06"], "H-A4": ["HKA-SC01-SH07"], "—": ["HKA-SC01-SH08", "HKB-SC01-SH07", "HKC-SC01-SH07", "HKC-SC01-SH08", "AF-SC07-SH00", "AF-SC09-SH00", "OC-SC12-SH01"], "H-B0": ["HKB-SC01-SH01"], "H-B1": ["HKB-SC01-SH02"], "H-B2": ["HKB-SC01-SH02"], "H-B3": ["HKB-SC01-SH03", "HKB-SC01-SH04"], "H-B4": ["HKB-SC01-SH05"], "H-B5": ["HKB-SC01-SH06"], "H-C0": ["HKC-SC01-SH01", "HKC-SC01-SH02"], "H-C1": ["HKC-SC01-SH03"], "H-C2": ["HKC-SC01-SH04"], "H-C3": ["HKC-SC01-SH05"], "H-C4": ["HKC-SC01-SH06"], "A": ["BF-SC02-SH01", "BF-SC02-SH13", "BF-SC03-SH01", "BF-SC03-SH05", "BF-SC03-SH07", "PB-SC04-SH01", "PB-SC04-SH04", "PB-SC04-SH05", "PB-SC05-SH01", "TN-SC05-SH05", "TN-SC06-SH01", "TN-SC06-SH04", "TN-SC06-SH06", "TN-SC06-SH08", "TN-SC06-SH10", "TN-SC06-SH12", "AF-SC07-SH01", "AF-SC07-SH05", "AF-SC08-SH01", "AF-SC08-SH08", "AF-SC09-SH01", "AF-SC09-SH03", "AF-SC09-SH05", "AF-SC10-SH01", "AF-SC10-SH04", "AF-SC10-SH05"], "P-001": ["BF-SC02-SH02"], "P-002": ["BF-SC02-SH03"], "P-003": ["BF-SC02-SH04"], "P-004": ["BF-SC02-SH05"], "P-005": ["BF-SC02-SH06", "BF-SC02-SH07"], "P-006": ["BF-SC02-SH08", "BF-SC02-SH09"], "P-007": ["BF-SC02-SH10"], "P-008": ["BF-SC02-SH11"], "P-009": ["BF-SC02-SH12"], "P-010": ["BF-SC03-SH02"], "P-011": ["BF-SC03-SH03"], "P-012": ["BF-SC03-SH04"], "P-013": ["BF-SC03-SH06"], "P-014": ["PB-SC04-SH02"], "P-015": ["PB-SC04-SH03"], "P-016": ["PB-SC04-SH06"], "P-017": ["PB-SC04-SH07"], "P-018": ["PB-SC04-SH08"], "P-019": ["PB-SC04-SH09"], "P-020": ["PB-SC05-SH02"], "P-021": ["PB-SC05-SH03"], "P-022": ["TN-SC05-SH04"], "P-023": ["TN-SC05-SH06"], "P-024": ["TN-S const R = {};

R.absorb = () => `
  <p class="intro">Step 1, §42. Instruments ran before any reading: the numbers below settle pacing, audio and colour. Style is copied from the winner; surface is replaced; execution is upgraded.</p>
  <div><h2>Part 1 · Measured</h2></div>
  ${table(['Instrument','Reading','Settles'], D.measured.map(r=>`<tr><td>${esc(r[0])}</td><td class="w">${esc(r[1])}</td><td class="w">${esc(r[2])}</td></tr>`))}
  <div class="card"><div class="eyebrow">Luminance by act (mean Y, 0–255)</div>
    <div class="colscript">${[['HK',12,78],['BF',78,82],['PB',62,77],['TN',94,83],['AF',75,95],['OC',19,112]].map(([a,w,y])=>`<span style="--w:${w};background:rgb(${Math.round(y*1.25)},${Math.round(y*1.12)},${Math.round(y*.95)})">${a} ${y}</span>`).join('')}</div>
    <div class="small">Bar widths are act lengths in seconds; fill is the measured mean luminance. Dim until the Turn, then it climbs.</div></div>
  <div><h2>Part 2 · Structure map</h2></div>
  ${table(['Seconds','Act','What happens','§30B function','Device'], D.structure.map(r=>`<tr><td class="id">${r[0]}</td><td>${pill(r[1],'SH')}</td><td class="w">${esc(r[2])}</td><td>${esc(r[3])}</td><td class="w">${esc(r[4])}</td></tr>`))}
  <div><h2>Part 3 · Style Lock</h2></div>
  <div class="card"><dl class="spec">${D.style.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>
  <div class="small">Capture axis never yields: the reference's camera is not copied. This build runs Mode 4, so its look is measured into the Film Look Sheet (see Film look).</div></div>
  <div><h2>Part 4 · Script absorption</h2></div>
  <div class="card"><dl class="spec">
    <dt>Skeleton match</dt><dd>Your script already follows the reference's formula slot for slot: crisis hook → family pressure (daughter) → night fear (husband) → public cost (the wedding) → messenger with her own proof (Barbara) → mechanism → objection ("It'll slip") → trial → doctor confirms → mirror payoffs → friend referral with the offer.</dd>
    <dt>Voice fingerprint</dt><dd>Short lines, many fragments, names used as punctuation ("Frank." "Barbara…"), callbacks ("That's exactly what I said" ×2). Matches the reference.</dd>
    <dt>Lines</dt><dd>76 body lines (919 words) + 13 hook lines across three variants. Every one is carried; see Phrase ledger.</dd>
  </dl></div>
  <div><h2>Part 5 · Surfaced, not absorbed</h2></div>
  ${table(['Reference device','Rule','Our disposition'], D.surfaced.map(r=>`<tr><td class="w">${esc(r[0])}</td><td>${esc(r[1])}</td><td class="w">${esc(r[2])}</td></tr>`))}
  <div><h2>Part 6 · Beat-it plan</h2></div>
  ${table(['Reference weakness','Our delta','Carried by'], D.beatit.map(r=>`<tr><td class="w">${esc(r[0])}</td><td class="w">${esc(r[1])}</td><td class="id">${esc(r[2])}</td></tr>`))}
  <p class="small">Part 7 · the confirmation gate is the Decisions tab.</p>`;

let actFilter = 'ALL';
R.acts = () => {
  const acts = ['ALL','HK','BF','PB','TN','AF','OC'];
  const names = {HK:'Hook',BF:'Before',PB:'Problem',TN:'Turn',AF:'After',OC:'Offer & close'};
  const sceneOf = b => { const m = b.id.match(/^(\w+)-(SC\d+)/); return m[2]; };
  const blocks = D.scenes.filter(s=>actFilter==='ALL'||s.act.includes(actFilter)).map(s=>{
    const scNum = s.id.match(/SC\d+/)[0]; const pre = s.id.split('-')[0];
    const bs = D.beats.filter(b=> b.id.includes(scNum) && (pre.startsWith('HK') ? b.id.startsWith(pre) : !b.id.startsWith('HK')));
    return `<div class="scene">
      <div class="scene-h"><span class="sid">${esc(s.id)}</span><h3>${esc(s.title)}</h3><span class="small">${bs.filter(b=>b.kind!=='CARD').length} shots · story day ${esc(s.day)}</span></div>
      <div class="bible">${[['Location',s.loc],['Time & light',s.time],['Cast',s.cast],['Axis',s.axis],['Delivery',s.route],['Emotion map',s.emo],['Props',s.props],['In',s.tin],['Out',s.tout]].map(([k,v])=>`<div><span class="k">${k}</span><span>${esc(v)}</span></div>`).join('')}</div>
      ${table(['Beat','Phrase','Type','Scale','Rig','Function','Shot','EMO','Product','Note'], bs.map(b=>`<tr><td class="id">${esc(b.id)}</td><td class="id">${esc(b.p)}</td><td>${pill(b.kind)}</td><td class="id">${esc(b.scale)}</td><td class="id">${esc(b.rig)}</td><td class="id">${esc(b.fn)}</td><td class="w">${esc(b.subj)}</td><td>${esc(b.emo)}</td><td>${b.vis==='—'?'<span class="small">—</span>':pill(b.vis)}</td><td class="w small">${esc(b.note)}</td></tr>`))}
    </div>`;}).join('');
  return `<p class="intro">Step 5. Fourteen scenes (three hook alternates, ten story scenes, the end card), each with its Scene Bible and shot list. Rigs are Mode 4 F-rigs; functions are §30B; product states follow §9D. Every phrase is carried by at least one shot. Hook variants are alternates: one ships per test.</p>
  <div class="chips" role="group" aria-label="Filter by act">${acts.map(a=>`<button class="chip" data-act="${a}" aria-pressed="${a===actFilter}">${a==='ALL'?'All acts':a+' · '+names[a]}</button>`).join('')}</div>
  ${blocks}
  <div class="recon">Reconciliation · 76 body phrases + 13 hook lines · 76/76 carried · 0 uncovered · ${shots.length} shots (${D.beats.filter(b=>b.kind==='SH').length} SH · ${D.beats.filter(b=>b.kind==='LS').length} LS · ${D.beats.filter(b=>b.kind==='SIL').length} silent · ${D.beats.filter(b=>b.kind==='INS').length} inserts · ${D.beats.filter(b=>b.kind==='MECH').length} mechanism) + ${D.beats.filter(b=>b.kind==='CARD').length} post cards</div>`;
};

R.inv = () => `
  <p class="intro">§27B inventory built mechanically from the script as written. Every dialogue line is disposition SH (spoken in a scene shot); Joan's two lines are off-screen over Margaret.</p>
  ${table(['Phrase','Scene','Speaker','Line','Disposition','Carried by'], D.inv.map(r=>`<tr><td class="id">${r.p}</td><td class="id">${r.sc}</td><td class="id">${r.who}</td><td class="w">${esc(r.line)}</td><td>${pill(r.who==='JOAN'?'SH·OFF':'SH','SH')}</td><td class="id">${(D.carry[r.p]||[]).join('<br>')}</td></tr>`))}
  <div><h2>Hook lines</h2></div>
  ${table(['Variant','Speaker','Line'], D.hooks.flatMap(h=>h.lines.map((l,i)=>`<tr><td class="id">${i?'':esc(h.name)}</td><td class="id">${esc(l.who)}</td><td class="w">${esc(l.line)}</td></tr>`)))}`;

R.ward = () => {
  const order=['HKA','HKB','HKC','D1','D1 night','D2','D3','D4','D5','D6','D7'];
  const w=[...D.ward].sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0]));
  return `<p class="intro">§21 and §14A. One outfit per story day, keyed to the story, never to the scene. Scenes on the same day share it (SC05 + SC06, SC09 + SC10). Hem rule from the Product Sheet: no hem at the knee. Visibility follows §9D.</p>
  ${table(['Day','Subject','Base','Mid','Outer','Lower','Foot','Accent','Colour family','Events · visibility'], w.map(r=>`<tr><td class="id">${esc(r[0])}</td><td><b>${esc(r[1])}</b></td>${r.slice(2,8).map(x=>`<td>${esc(x)}</td>`).join('')}<td class="id">${esc(r[8])}</td><td class="w small">${esc(r[9])}</td></tr>`))}

  ${table(['Audit','Result','Detail'],[
    ['Class repetition',pill('PASS'),'No BASE class repeats inside an act for any character. Margaret\'s roll-neck appears in BF and AF, never twice in one act'],
    ['Change depth',pill('PASS'),'Every consecutive day changes at least two layers, BASE among them (checked for Margaret D1→D7, Frank, Sarah, Barbara, Emily)'],
    ['Colour rotation',pill('PASS'),'Margaret: green → red → navy → earth → navy → pattern → earth. No two consecutive days share a family. Emily moved to sage on D6 to clear it'],
    ['Day coverage',pill('PASS'),'Every on-screen character in all 14 scenes has an outfit row. W1 and W2 are one-offs, dressed in the shot'],
  ].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="w">${r[2]}</td></tr>`))}
  <div class="card"><div class="eyebrow">Signature items (the only permitted repeats)</div>
  <ul class="clean"><li>Margaret: reading glasses on a bead chain</li><li>Frank: oatmeal cable cardigan (from his sheet)</li><li>Barbara: purple glass-bead necklace</li><li>Sarah: small gold hoops</li></ul>
  <div class="small">Nightwear in SC03 is a declared event inside story day D1, not a new day.</div></div>`;
};

R.dec = () => `
  <p class="intro">The §42 Part 7 gate. Where the script collides with the Product Sheet or a locked standard, the render follows the higher layer and the line is flagged, not rewritten. Each row has the default I'll build to unless you say otherwise.</p>
  ${D.decisions.map(d=>`<div class="dec"><span class="code">${d[0]}</span><span class="t">${esc(d[1])}</span><p>${esc(d[2])}</p><span class="rec">${esc(d[3])}</span></div>`).join('')}`;

const tabs=$('#tabs'), panels=$('#panels');
function show(id){
  let t = id; if(!R[t]) t='absorb';
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected', b.dataset.t===t));
  panels.innerHTML = `<section class="panel" role="tabpanel">${R[t]()}</section>`;
  const lc=$('#lookc'); if(lc) lc.textContent = D.lookstr.length+' chars';
  try{localStorage.setItem('swa-tab',t)}catch(e){}
}
const counts={cast:D.cast.length,locs:D.locs.length,acts:D.scenes.length,dec:D.decisions.length,inv:D.inv.length};
tabs.innerHTML = TABS.map(([id,l])=>`<button role="tab" data-t="${id}">${l}${counts[id]?`<span class="n">${counts[id]}</span>`:''}</button>`).join('');
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)});
panels.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(c){actFilter=c.dataset.act; show('acts'); return;}
  const cp=e.target.closest('.copy'); if(cp){const el=document.getElementById(cp.dataset.copy);
    const done=()=>{cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy',1400)};
    navigator.clipboard?.writeText(el.textContent).then(done,()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);});}
});
let start='absorb'; const h=location.hash.slice(1); if(R[h]) start=h; else { try{start=localStorage.getItem('swa-tab')||'absorb'}catch(e){} }
show(start);
</script>
