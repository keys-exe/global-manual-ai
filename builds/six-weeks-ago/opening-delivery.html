arah", "button-down shirt, chambray", "—", "—", "cords, tan", "loafers, brown", "signature hoops", "earth", "AF-SC09 stairs ; AF-SC10 doorway"], ["D6", "Emily", "long-sleeve tee, cream", "vintage fair-isle cardigan, rust and teal", "—", "wide-leg cords, rust", "chunky lace-up boots, oxblood", "—", "pattern-led", "AF-SC10 · kitchen · register changed to clear Sarah (§19A)"], ["D7", "Margaret", "tunic, mustard", "—", "—", "leggings, charcoal", "slipper boots, grey knit", "signature glasses", "earth", "OC-SC11 · living room · CONCEALED ; two straps HELD"]], "inv": [{"p": "P-001", "sc": "SC02", "who": "SARAH", "dir": "", "line": "It's just a stairlift, Mom. Just look at it."}, {"p": "P-002", "sc": "SC02", "who": "MARGARET", "dir": "", "line": "I know what it is."}, {"p": "P-003", "sc": "SC02", "who": "SARAH", "dir": "", "line": "I watched you come down those stairs backwards."}, {"p": "P-004", "sc": "SC02", "who": "MARGARET", "dir": "", "line": "Then don't watch."}, {"p": "P-005", "sc": "SC02", "who": "SARAH", "dir": "her voice cracking", "line": "Somebody has to. You're 71. Some days you don't even come downstairs. Dad's bringing your tea up on a tray."}, {"p": "P-006", "sc": "SC02", "who": "MARGARET", "dir": "", "line": "I've done the physio, Sarah. The painkillers. The injections. I've got a drawer full of braces upstairs, and the last one slid down around my ankle by the evening."}, {"p": "P-007", "sc": "SC02", "who": "SARAH", "dir": "", "line": "So let them put the stairlift in."}, {"p": "P-008", "sc": "SC02", "who": "MARGARET", "dir": "", "line": "A stairlift is how it starts."}, {"p": "P-009", "sc": "SC02", "who": "SARAH", "dir": "", "line": "How what starts?"}, {"p": "P-010", "sc": "SC03", "who": "FRANK", "dir": "in the dark", "line": "Do you ever think about which one of us goes first?"}, {"p": "P-011", "sc": "SC03", "who": "MARGARET", "dir": "", "line": "Frank."}, {"p": "P-012", "sc": "SC03", "who": "FRANK", "dir": "", "line": "If it's me... who gets you down the stairs?"}, {"p": "P-013", "sc": "SC03", "who": "MARGARET", "dir": "", "line": "Go to sleep, love."}, {"p": "P-014", "sc": "SC04", "who": "EMILY", "dir": "in her wedding dress, holding out her hands", "line": "Grandma, you promised. When I was little, you said you'd dance at my wedding."}, {"p": "P-015", "sc": "SC04", "who": "MARGARET", "dir": "smiling, eyes wet", "line": "I know I did, sweetheart. I'll watch from here."}, {"p": "P-016", "sc": "SC04", "who": "FRANK", "dir": "", "line": "Is that Barbara out there? Your cousin Barbara?"}, {"p": "P-017", "sc": "SC04", "who": "MARGARET", "dir": "", "line": "She's 74."}, {"p": "P-018", "sc": "SC04", "who": "FRANK", "dir": "", "line": "I thought her knees were bone on bone."}, {"p": "P-019", "sc": "SC04", "who": "MARGARET", "dir": "watching her", "line": "They are. I always thought hers weren't as bad as mine."}, {"p": "P-020", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "You've done this every morning since I got here. Two pills, the gel, the brace and an ice pack."}, {"p": "P-021", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "For eleven years."}, {"p": "P-022", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "Can I show you something?"}, {"p": "P-023", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "It's called Stryde. I had it on at the wedding. All night."}, {"p": "P-024", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "That little thing? Barbara, that can't possibly work on knees like mine."}, {"p": "P-025", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "That's exactly what I said. Last winter I was sleeping on my sofa because I couldn't get up my own stairs."}, {"p": "P-026", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "Every brace you've ever bought was made to keep you comfortable while your knee got worse. A sleeve just squeezes the knee. A brace just stops it going sideways. Does your knee hurt going sideways?"}, {"p": "P-027", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "No."}, {"p": "P-028", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "It hurts coming down the stairs. Put your finger just under your kneecap. Two centimetres down. Press in. Feel that band?"}, {"p": "P-029", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "Yes."}, {"p": "P-030", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "That's the tendon. Every step you take lands right there. Seventeen times your bodyweight goes through it. Every stride."}, {"p": "P-031", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "Barbara, my knees are bone on bone. There's nothing left in there."}, {"p": "P-032", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "Mine too. This doesn't put anything back. Nothing can, and anyone who tells you otherwise is lying to you. I'm 74, Margaret. I haven't got time to lie to you."}, {"p": "P-033", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "Then what does it do?"}, {"p": "P-034", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "It changes where the weight lands. It sits just under the kneecap, right on that band. There's a silicone pad on the inside. The pad presses on that one spot, instead of spreading the pressure around the whole knee like a sleeve does. It catches the weight and moves it off the worn part, before it gets to the joint."}, {"p": "P-035", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "They measured it. Thirty four percent less strain, every step."}, {"p": "P-036", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "Bone on bone, arthritis, worn cartilage, meniscus. Whichever one your doctor said it was, that's the spot taking the weight. Every brace and every injection you've had was aimed at the whole knee. Not that spot. That's why nothing worked."}, {"p": "P-037", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "Your arthritis will still be there. The weight just won't be landing where it hurts."}, {"p": "P-038", "sc": "SC05", "who": "MARGARET", "dir": "", "line": "It'll slip. They all slip."}, {"p": "P-039", "sc": "SC05", "who": "BARBARA", "dir": "", "line": "It's adjustable, and it doesn't go over the joint, so there's nothing to bunch up or roll down. Ten seconds to put on. It sits flat under your trousers, and you forget it's there. They spent three years building it with orthopaedic surgeons. Over two hundred thousand people wear one."}, {"p": "P-040", "sc": "SC05", "who": "MARGARET", "dir": "quietly", "line": "I can't try another thing that doesn't work, Barbara. I can't get my hopes up again."}, {"p": "P-041", "sc": "SC05", "who": "BARBARA", "dir": "putting a strap in her hand", "line": "Then don't get your hopes up. Just put it on and walk down the stairs. And keep your hand on the rail. I'm not crazy."}, {"p": "P-042", "sc": "SC06", "who": "MARGARET", "dir": "", "line": "I can't, Barbara. I haven't come down these forwards in two years."}, {"p": "P-043", "sc": "SC06", "who": "BARBARA", "dir": "", "line": "Hand on the rail. One step. That's all I'm asking."}, {"p": "P-044", "sc": "SC06", "who": "BARBARA", "dir": "", "line": "Feel that under the kneecap? That's the weight going somewhere else."}, {"p": "P-045", "sc": "SC06", "who": "MARGARET", "dir": "tears running", "line": "Barbara... I'm not gripping it."}, {"p": "P-046", "sc": "SC06", "who": "BARBARA", "dir": "her own eyes wet", "line": "I know, love. Keep coming."}, {"p": "P-047", "sc": "SC06", "who": "MARGARET", "dir": "", "line": "I can't believe it. I can't believe it."}, {"p": "P-048", "sc": "SC06", "who": "BARBARA", "dir": "", "line": "Well, don't just stand there. Put the kettle on."}, {"p": "P-049", "sc": "SC07", "who": "DOCTOR", "dir": "looking at an X-ray", "line": "Your new X-ray looks exactly like the old one, Margaret. Bone on bone, both knees."}, {"p": "P-050", "sc": "SC07", "who": "MARGARET", "dir": "", "line": "I know."}, {"p": "P-051", "sc": "SC07", "who": "DOCTOR", "dir": "", "line": "So how did you just walk in here like that?"}, {"p": "P-052", "sc": "SC07", "who": "DOCTOR", "dir": "leaning in, then nodding", "line": "That makes sense. It's moving the weight off the worn part. Keep wearing it."}, {"p": "P-053", "sc": "SC07", "who": "MARGARET", "dir": "smiling", "line": "I wasn't planning on taking it off."}, {"p": "P-054", "sc": "SC08", "who": "FRANK", "dir": "", "line": "I was just coming to look for you. You were gone a long time."}, {"p": "P-055", "sc": "SC08", "who": "MARGARET", "dir": "", "line": "I know."}, {"p": "P-056", "sc": "SC08", "who": "FRANK", "dir": "", "line": "Where did you go?"}, {"p": "P-057", "sc": "SC08", "who": "MARGARET", "dir": "", "line": "Into town."}, {"p": "P-058", "sc": "SC08", "who": "FRANK", "dir": "", "line": "You walked into town? That's two miles."}, {"p": "P-059", "sc": "SC08", "who": "MARGARET", "dir": "putting the bags down", "line": "Each way."}, {"p": "P-060", "sc": "SC08", "who": "FRANK", "dir": "", "line": "I called the stairlift man."}, {"p": "P-061", "sc": "SC08", "who": "MARGARET", "dir": "", "line": "Frank..."}, {"p": "P-062", "sc": "SC08", "who": "FRANK", "dir": "", "line": "I told him not to come. (his voice goes) All those nights I lay there thinking, if it's me that goes first..."}, {"p": "P-063", "sc": "SC08", "who": "MARGARET", "dir": "taking his hand", "line": "Then I'll manage the stairs."}, {"p": "P-064", "sc": "SC09", "who": "SARAH", "dir": "", "line": "Slowly, Mom. I'm right behind you."}, {"p": "P-065", "sc": "SC09", "who": "MARGARET", "dir": "", "line": "You can put your arms down now, love."}, {"p": "P-066", "sc": "SC09", "who": "SARAH", "dir": "tearing up", "line": "Mom... when did that happen?"}, {"p": "P-067", "sc": "SC09", "who": "MARGARET", "dir": "", "line": "Six weeks ago. Barbara happened."}, {"p": "P-068", "sc": "SC09", "who": "SARAH", "dir": "", "line": "What does that even mean?"}, {"p": "P-069", "sc": "SC09", "who": "MARGARET", "dir": "pulling up her trouser leg", "line": "It sits on the tendon under my kneecap and moves the weight off the worn part. My knees are still 71. It's not because the arthritis has gone. It's because the weight isn't landing where it hurts."}, {"p": "P-070", "sc": "SC10", "who": "EMILY", "dir": "", "line": "Grandma. You still owe me a dance."}, {"p": "P-071", "sc": "SC10", "who": "MARGARET", "dir": "", "line": "I always keep my promises."}, {"p": "P-072", "sc": "SC11", "who": "MARGARET", "dir": "on the phone", "line": "Joan, it's me. I've found something for your knees."}, {"p": "P-073", "sc": "SC11", "who": "JOAN", "dir": "", "line": "Oh, Margaret. Not another one."}, {"p": "P-074", "sc": "SC11", "who": "MARGARET", "dir": "", "line": "That's exactly what I said. It's called Stryde. Barbara gave me one. Get it from their website, the real one. There are copies out there. It's two for one right now, so you can do both knees. And if it doesn't work, you get your money back. Sixty days, and you keep the straps."}, {"p": "P-075", "sc": "SC11", "who": "JOAN", "dir": "", "line": "Well. What have I got to lose?"}, {"p": "P-076", "sc": "SC11", "who": "MARGARET", "dir": "", "line": "Nothing. Come over on Sunday. You're walking up my stairs on your own."}], "hooks": [{"name": "A · \"Get away\"", "vis": "Cool, grey grade. Extreme close-up: her knee trembles as she lowers herself backwards down the stairs, leading with the same foot, knuckles white on the banister. Sarah drops her shopping in the hall and runs up. Close-up: Margaret yanks her arm out of Sarah's hand. Sarah freezes. Close-up: Margaret turns her face to the wall with her chin shaking. She isn't angry, she's ashamed. Cut to a black screen with white text: 6 weeks ago", "lines": [{"who": "SARAH", "dir": "", "line": "Mom! Your knee! Here, let me help you."}, {"who": "MARGARET", "dir": "", "line": "No! I can do this. Get away from me!"}, {"who": "SARAH", "dir": "quietly", "line": "Mom, you're going down backwards."}, {"who": "MARGARET", "dir": "face to the wall", "line": "I know. Please don't watch me."}]}, {"name": "B · \"Seventy-one!\"", "vis": "Warm, bright grade. A busy station staircase at rush hour, with rails on both sides and one down the middle. Close-up: two women in their late 40s, each gripping a side rail, stiff-kneed, one step at a time. Margaret (71, work lanyard, handbag) comes down the middle almost running, her hand skimming the centre rail. Extreme close-up: her knees move easily, and a small black strap shows just under the kneecap below a cropped trouser hem. She slips between the two women, both heads turn, and she's gone. Cut to a black screen with white text: 6 weeks ago", "lines": [{"who": "WOMAN 1", "dir": "", "line": "My knees hate these stairs."}, {"who": "WOMAN 2", "dir": "", "line": "Tell me about it."}, {"who": "MARGARET", "dir": "from behind, hurrying", "line": "Excuse me! Sorry, love, I'm late for work!"}, {"who": "WOMAN 1", "dir": "staring after her", "line": "She's got to be seventy!"}, {"who": "MARGARET", "dir": "from the bottom, not looking back", "line": "Seventy-one!"}]}, {"name": "C · The floor", "vis": "Cool, grey grade. Close-up: a mug slides off the counter. Margaret bends for it. Extreme close-up: her right knee buckles sideways and she shouts as she drops. Frank (70s, cardigan) gets down slowly, puts his arm under hers and pulls. Close-up: his arms shake, and she doesn't move. Wide: they end up sitting on the floor together, backs against the cupboards. Cut to a black screen with white text: 6 weeks ago", "lines": [{"who": "MARGARET", "dir": "", "line": "Frank! Frank, it's my knee!"}, {"who": "FRANK", "dir": "", "line": "I've got you. Give me your arm."}, {"who": "MARGARET", "dir": "", "line": "Stop, Frank. You'll hurt your back."}, {"who": "FRANK", "dir": "still pulling, arms shaking", "line": "I'm not leaving you on the floor."}]}], "carry": {"H-A0": ["HKA-SC01-SH01", "HKA-SC01-SH02"], "H-A1": ["HKA-SC01-SH03"], "H-A2": ["HKA-SC01-SH04", "HKA-SC01-SH05"], "H-A3": ["HKA-SC01-SH06"], "H-A4": ["HKA-SC01-SH07"], "—": ["HKA-SC01-SH08", "HKB-SC01-SH07", "H  "palette": "Cream walls, sage carpet, dark wood, ivory bedding, faded floral curtains", "light": "Night: cool streetlight glow through the nets, a sliver of warm landing light at the door. S2 wants a lamp in frame: add a bedside lamp, switched off (D15)"}, {"id": "L-LIV", "name": "Living room", "tier": "PLATED", "beats": "6 shots · SC11", "plate": "Supplied · pass", "prop": "Front (east), bay window onto the street through nets; door to the hall", "geo": "Bay on the far wall; fireplace on the right wall; sofa on the left; armchair in the bay", "anchors": "The dusky-pink wingback armchair with a lace antimacassar in the bay · the matching pink sofa · the nest of mahogany tables with the cordless phone · the marble fire surround with the brass gas fire · wedding photos on the mantel", "loose": "Cordless phone (SC11: in Margaret's hand) · two straps (SC11: in hand) · newspaper and glasses on the side table", "palette": "Cream walls, sage carpet, dusky pink upholstery, pale marble, brass", "light": "Afternoon: soft even light from the east bay, no direct sun"}, {"id": "L-WED", "name": "Wedding reception room", "tier": "PLATED · standalone", "beats": "9 shots · SC04", "plate": "Supplied · pass (stays empty; guests go in the scene master)", "prop": "Golf-club function room, not part of the house", "geo": "Dance floor in the middle; DJ booth in the corner between two window walls; round tables around the floor; cake table by the picture window", "anchors": "The parquet dance floor with its brass edge strip · the DJ booth with the four-head light bar and two speakers · the three-tier cake by the picture window · the leaded windows onto the course · fairy lights strung across the ceiling", "loose": "Champagne flutes, crackers, confetti on the tables", "palette": "Cream and ivory linen, honey parquet, brown carpet, green fairway outside", "light": "Late-afternoon low sun through the picture window; fairy lights as practicals. Kept in daylight so SC03 is the film's only night n gets the afternoon sun (SC10) and the front door stays soft (SC08), matching what the supplied plates already show", "PASS"], ["S4 · consecutive acts change rooms", "HKA→SC02, SC03→SC04, SC06→SC07, SC10→SC11 all change rooms. With Hook C, both the hook and SC02 are in the kitchen (D16). SC05 runs across the PB/TN boundary as one continuous scene", "FLAG"], ["Plate consistency across rooms", "Carpet, walls, ceilings, doors and brass fittings match in all five house plates. The only mismatch is the missing wall rail on the hall plate (D13)", "FLAG"]]}, "voice": {"neg": "never a smooth announcer voice, never RP newsreader neutral, never audiobook-warm, never a generic voiceover artist, never the same voice as any other character in the build, never younger than the character, never a mid-pitch evenly paced narrator with no wear and no habits, no American vowel colouring, no studio polish, no generic intensity on emphatic lines, no voice that could read any script for any brand", "meas": {"MARGARET": {"f0": 163, "rng": 6.9, "syl": 6.42, "wpm": 172, "pause": 2.3, "dur": 10.1, "final": "−1.2 to −5.6 st (gentle falls)", "cent": 1385, "breath": 0.083}, "BARBARA": {"f0": 179, "rng": 9.5, "syl": 5.43, "wpm": 159, "pause": 1.6, "dur": 11.7, "final": "−1.7 to −8.8 st (hard falls)", "cent": 1514, "breath": 0.095}, "FRANK": {"f0": 140, "rng": 7.3, "syl": 6.58, "wpm": 235, "pause": 1.1, "dur": 7.7, "final": "−3.4 to +0.3 st", "cent": 1289, "breath": 0.062}, "SARAH": {"f0": 220, "rng": 8.1, "syl": 6.76, "wpm": 180, "pause": 1.5, "dur": 9.7, "final": "−7.1 to +0.9 st (one lift)", "cent": 1524, "breath": 0.098}, "EMILY": {"f0": 209, "rng": 6.7, "syl": 7.01, "wpm": 176, "pause": 1.6, "dur": 7.1, "final": "−2.0 to −6.0 st", "cent": 1398, "breath": 0.075}, "DOCTOR": {"f0": 107, "rng": 6.2, "syl": 6.78, "wpm": 219, "pause": 1.5, "dur": 11.0, "final": "−3.3 to −5.5 st (even)", "cent": 1178, "breath": 0.06}}, "strings": {"MARGARET": "A woman of seventy-one, Nottinghamshire, low in the chest for her age, stop-start: short runs cut off by full stops she means. Short flat vowels and dropped h's, nothing southern, no RP. A little breath on the tone and a dry catch on long vowels. Measured pace, listing things off one at a time. Sentences land gently falling, never lifting. Soft consonants, glottal final t's. Held vowels waver and breath runs short on long lines. Emphasis goes quieter and slower, never louder. A short breath out through the nose before an admission; a dry laugh that stops early.", "BARBARA": "A woman of seventy-four, Black Country, a wide swooping melody that crashes down hard at the end of every line, unhurried and weighted. Broad Black Country vowels, placed but never comic. Gravel in the throat, plenty of breath on the tone. Slow and steady, never rushed, leaning on one word per line. Lines swoop up through the middle and land low and final. Crisp t's and d's when she makes a point. The top of the voice thins and cracks when raised. Emphasis is slower and lower. A dry snort of a laugh; a brisk tut; a long exhale before she tells the truth.", "FRANK": "A man of seventy-six, Nottinghamshire and broader than his wife, a light high-lying voice for his age that runs on in long unbroken strings. Rounded Midlands vowels, dropped g's, no RP. Clean and dry, little breath, a slight tremor on held notes. Quick, words tumbling together, few stops. Statements fall; questions stay flat rather than lifting. Soft consonants. Breath gives out at the end of long runs and the voice thins. Emphasis: he stops dead, then says the word quietly. Clears his throat before hard things; a shaky in-breath when his voice goes.", "SARAH": "A woman of about fifty, Nottingham softened by years in an office, a bright breathy head voice that cracks upward under strain, quick and pressing. Midlands vowels trimmed, never broad, never RP. Breath audible in the tone, clear edges. Fast even runs with no hesitation. Sentences fall; pleading lines lift at the end. Crisp consonants. No age wear; strain shows as a tightening crack. Emphasis rises and cracks, then drops to almost a whisper. A sharp in-breath before she argues; a wet laugh through tears.", "EMILY": "A woman of about thirty, Nottingham, light and high in the head with a quick bouncing rhythm and a smile audible in the vowels. Young Midlands, relaxed glottal t's, no RP. Higher and thinner than her mother's voice, clear, little breath. The fastest speaker in the family, syllables skipping. Lines end with a playful fall. Relaxed, slightly clipped consonants. No wear. Emphasis is a lift and a stretched vowel, never force. A quick giggle; 'Grandma' drawn out when she pleads.", "DOCTOR": "A man in his late forties, educated Edinburgh, low and level with almost no melody, brisk and exact. Clipped Scottish vowels, rolled or tapped r's, no RP, nothing English. Low in the chest, clean and dry, no rasp. Quick even tempo, sentences in one breath. Every line lands on the same measured fall. Consonants fully sounded. No age wear. Emphasis by slowing down and spacing the words, never by raising pitch. A short exhale through the nose while he reads; a single low 'hm' of recognition.", "JOAN": "A woman of seventy-three, Lincolnshire, a thin reedy head voice with a slow, weary drawl that sags at the end of every line. Flat Lincolnshire vowels, no RP. Nasal colouring, dry. Slow, long vowels, a pause before she gives in. Lines trail off downwards. Soft, lazy consonants. Wavering held vowels, breath short. Emphasis is a sigh on the key word. A long weary sigh; a small reluctant laugh."}, "axes": ["Face architecture", "Hair", "Age position", "Build", "Class / wardrobe register", "Marker", "Voice", "Environment"], "a19": {"MARGARET": ["Broad round face, soft jowl, small straight nose, hazel eyes", "Silver-white chin-length bob, side part", "71, the band's middle", "Heavy-set, pear-shaped, rounded shoulders", "Tidy retired homemaker: shirt-dresses, knitwear, slippers", "Small healed red scar acros   <p class="intro">§27B inventory built mechanically from the script as written. Every dialogue line is disposition SH (spoken in a scene shot); Joan's two lines are off-screen over Margaret.</p>
  ${table(['Phrase','Scene','Speaker','Line','Disposition','Carried by'], D.inv.map(r=>`<tr><td class="id">${r.p}</td><td class="id">${r.sc}</td><td class="id">${r.who}</td><td class="w">${esc(r.line)}</td><td>${pill(r.who==='JOAN'?'SH·OFF':'SH','SH')}</td><td class="id">${(D.carry[r.p]||[]).join('<br>')}</td></tr>`))}
  <div><h2>Hook lines</h2></div>
  ${table(['Variant','Speaker','Line'], D.hooks.flatMap(h=>h.lines.map((l,i)=>`<tr><td class="id">${i?'':esc(h.name)}</td><td class="id">${esc(l.who)}</td><td class="w">${esc(l.line)}</td></tr>`)))}`;

R.ward = () => {
  const order=['HKA','HKB','HKC','D1','D1 night','D2','D3','D4','D5','D6','D7'];
  const w=[...D.ward].sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0]));
  return `<p class="intro">§21 and §14A. One outfit per story day, keyed to the story, never to the scene. Scenes on the same day share it (SC05 + SC06, SC09 + SC10). Hem rule from the Product Sheet: no hem at the knee. Visibility follows §9D.</p>
  ${table(['Day','Subject','Base','Mid','Outer','Lower','Foot','Accent','Colour family','Events · visibility'], w.map(r=>`<tr><td class="id">${esc(r[0])}</td><td><b>${esc(r[1])}</b></td>${r.slice(2,8).map(x=>`<td>${esc(x)}</td>`).join('')}<td class="id">${esc(r[8])}</td><td class="w small">${esc(r[9])}</td></tr>`))}
  <div><h2>§14A audits</h2></div>
  ${table(['Audit','Result','Detail'],[
    ['Class repetition',pill('PASS'),'No BASE class repeats inside an act for any character. Margaret\'s roll-neck appears in BF and AF, never twice in one act'],
    ['Change depth',pill('PASS'),'Every consecutive day changes at least two layers, BASE among them (checked for Margaret D1→D7, Frank, Sarah, Barbara, Emily)'],
    ['Colour rotation',pill('PASS'),'Margaret: green → red → navy → earth → navy → pattern → earth. No two consecutive days share a family. Emily moved to sage on D6 to clear it'],
    ['Day coverage',pill('PASS'),'Every on-screen character in all 14 scenes has an outfit row. W1 and W2 are one-offs, dressed in the shot'],
  ].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="w">${r[2]}</td></tr>`))}
  <div class="card"><div class="eyebrow">Signature items (the only permitted repeats)</div>
  <ul class="clean"><li>Margaret: reading glasses on a bead chain</li><li>Frank: oatmeal cable cardigan (from his sheet)</li><li>Barbara: purple glass-bead necklace</li><li>Sarah: small gold hoops</li></ul>
  <div class="small">Nightwear in SC03 is a declared event inside story day D1, not a new day.</div></div>`;
};

R.dec = () => `
  <p class="intro">The §42 Part 7 gate. Where the script collides with the Product Sheet or a locked standard, the render follows the higher layer and the line is flagged, not rewritten. Each row has the default I'll build to unless you say otherwise.</p>
  ${D.decisions.map(d=>`<div class="dec"><span class="code">${d[0]}</span><span class="t">${esc(d[1])}</span><p>${esc(d[2])}</p><span class="rec">${esc(d[3])}</span></div>`).join('')}`;

const tabs=$('#tabs'), panels=$('#panels');
function show(id){
  let t = id; if(!R[t]) t='absorb';
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected', b.dataset.t===t));
  panels.innerHTML = `<section class="panel" role="tabpanel">${R[t]()}</section>`;
  const lc=$('#lookc'); if(lc) lc.textContent = D.lookstr.length+' chars';
  try{localStorage.setItem('swa-tab',t)}catch(e){}
}
const counts={cast:D.cast.length,locs:D.L.locs.length,acts:D.scenes.length,dec:D.decisions.length,inv:D.inv.length};
tabs.innerHTML = TABS.map(([id,l])=>`<button role="tab" data-t="${id}">${l}${counts[id]?`<span class="n">${counts[id]}</span>`:''}</button>`).join('');
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)});
panels.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(c){actFilter=c.dataset.act; show('acts'); return;}
  const cp=e.target.closest('.copy'); if(cp){const el=document.getElementById(cp.dataset.copy);
    const done=()=>{cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy',1400)};
    navigator.clipboard?.writeText(el.textContent).then(done,()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);});}
});
let start='absorb'; const h=location.hash.slice(1); if(R[h]) start=h; else { try{start=localStorage.getItem('swa-tab')||'absorb'}catch(e){} }
show(start);
</script>
